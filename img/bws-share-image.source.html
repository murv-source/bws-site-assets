<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body { font-family:'Inter',sans-serif; background:#F6F8FC; position:relative; overflow:hidden; color:#0A1F44; }
  .glow { position:absolute; right:-160px; top:-200px; width:720px; height:720px; border-radius:50%;
          background:radial-gradient(circle, rgba(30,107,255,0.16) 0%, rgba(30,107,255,0) 65%); }
  .ring { position:absolute; right:-90px; top:-120px; width:560px; height:560px; border-radius:50%;
          border:2px solid rgba(30,107,255,0.18); }
  .bar { position:absolute; left:0; top:0; bottom:0; width:14px; background:#1E6BFF; }
  .wrap { position:absolute; left:84px; top:70px; right:84px; bottom:62px; display:flex; flex-direction:column; }
  .logo { height:92px; width:auto; align-self:flex-start; }
  h1 { margin-top:54px; font-size:66px; line-height:1.06; font-weight:800; letter-spacing:-0.035em; max-width:900px; }
  h1 .accent { color:#1E6BFF; }
  .sub { margin-top:22px; font-size:25px; font-weight:500; color:#51607A; letter-spacing:-0.01em; }
  .foot { margin-top:auto; display:flex; align-items:center; gap:22px; font-size:24px; font-weight:600; }
  .pill { background:#1E6BFF; color:#fff; border-radius:999px; padding:12px 26px; font-weight:700; }
  .muted { color:#5B6B85; font-weight:600; }
</style></head>
<body>
  <div class="glow"></div><div class="ring"></div><div class="bar"></div>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="">
    <h1>Find the money your business <span class="accent">is leaving behind.</span></h1>
    <div class="sub">R&amp;D tax credits · Settlement recovery · Merchant savings · Benefits</div>
    <div class="foot">
      <span class="pill">Free discovery · No upfront cost</span>
      <span class="muted">bigwolfsolutions.net · (844) 443-0482</span>
    </div>
  </div>
</body></html>
