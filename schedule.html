<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Free Call | Big Wolf Solutions</title>
  <meta name="description" content="Schedule a free, no-pressure call with Big Wolf Solutions to find out what your business is leaving behind in tax credits, settlements, merchant fees, and benefits.">
  <link rel="icon" href="https://assets.cdn.filesafe.space/1ZMpwJ9nYwk9qTFScUtS/media/69cec39bfe4f1c0b67c6dd8c.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/murv-source/bws-site-assets@main/css/styles.css">
</head>
<body>
<div id="bws-home-root">

  
<!-- ══ NAV ════════════════════════════════════════════════ -->
  <div id="bws-header"></div>

  

  <!-- ══ BOOKING CALENDAR (no intermediate CTAs, straight to the calendar) ══ -->
  <section class="band" id="booking" style="padding-top:2.5rem">
    <div class="container">
      <p class="lead" style="text-align:center;margin:0 auto 1.5rem;font-size:1rem">Pick a time that works for you.</p>
      <div class="embed-frame"><iframe src="https://links.bigwolfsolutions.net/widget/booking/BVufHeXc7DYRJNvTcyrK" allow="payment" style="width:100%;min-height:760px;border:none;overflow:hidden;border-radius:12px;display:block;background:#fff" scrolling="no" id="IoDw7vgBi9pf00gcDzVU_1785360335124" title="Book a free call with Big Wolf Solutions"></iframe><script src="https://links.bigwolfsolutions.net/js/form_embed.js" type="text/javascript"></script></div>
    </div>
  </section>

<!-- ════ FOUNDER DIRECT-CONTACT BLOCK (reusable across pages) ════ -->
<div id="bws-footer"></div>

</div>

<script>
(function () {
  var BASE = 'https://cdn.jsdelivr.net/gh/murv-source/bws-site-assets@main/partials/';
  function runScripts(host){host.querySelectorAll('script').forEach(function(old){var s=document.createElement('script');for(var i=0;i<old.attributes.length;i++)s.setAttribute(old.attributes[i].name,old.attributes[i].value);s.textContent=old.textContent;old.parentNode.replaceChild(s,old);});}
  function inject(id,file){var host=document.getElementById(id);if(!host)return Promise.resolve();return fetch(BASE+file,{cache:'no-cache'}).then(function(r){return r.text();}).then(function(html){host.innerHTML=html;runScripts(host);});}
  inject('bws-header','header.html').then(function(){return inject('bws-footer','footer.html');});
})();
</script>
</body>
</html>
