<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://assets.cdn.filesafe.space/1ZMpwJ9nYwk9qTFScUtS/media/69cec39bfe4f1c0b67c6dd8c.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/murv-source/bws-site-assets@main/css/styles.css">
  <style>
    /* ── Blog-post-only additions — reuses site tokens, no new colors/fonts ── */
    body.tpl-blog-post .post-hero-img {
      display: block; width: 100%; max-width: var(--container); margin: 0 auto;
      aspect-ratio: 16/7; object-fit: cover; border-radius: var(--radius);
      border: 1px solid var(--line); box-shadow: 0 30px 60px -28px rgba(10,31,68,0.35);
    }
    body.tpl-blog-post .post-meta-row {
      display: flex; gap: 0.9rem; align-items: center; font-size: 0.88rem; color: var(--subdued);
      justify-content: center; margin-top: 0.4rem;
    }
    body.tpl-blog-post .breadcrumb { font-size: 0.85rem; color: var(--subdued); margin-bottom: 1rem; }
    body.tpl-blog-post .breadcrumb a { color: var(--subdued); text-decoration: none; }
    body.tpl-blog-post .breadcrumb a:hover { color: var(--ink); }
    body.tpl-blog-post .prose-wrap { max-width: 720px; margin: 0 auto; }
    body.tpl-blog-post .prose h2 { font-size: 1.5rem; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; margin: 2.4rem 0 0.9rem; }
    body.tpl-blog-post .prose ul { margin: 0 0 1.2rem; padding-left: 1.3rem; color: var(--body); }
    body.tpl-blog-post .prose li { margin-bottom: 0.5rem; line-height: 1.6; }
    body.tpl-blog-post .prose .inline-cta { margin: 0.5rem 0 1.6rem; }
    body.tpl-blog-post .author-box {
      display: flex; gap: 1rem; align-items: center; margin-top: 2.6rem; padding-top: 1.5rem; border-top: 1px solid var(--line);
    }
    body.tpl-blog-post .author-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: var(--surface); flex-shrink: 0; }
    body.tpl-blog-post .author-box p { margin: 0; color: var(--subdued); font-size: 0.92rem; }
    body.tpl-blog-post .author-box strong { color: var(--ink); font-size: 0.98rem; }
  </style>
</head>
<body class="tpl-blog-post">
<div id="bws-blog-post-root">

  <!-- ══ NAV (shared, injected) ══════════════════════════════ -->
  <div id="bws-header"></div>

  <!-- ══ POST HEADER ═════════════════════════════════════════ -->
  <section class="subhero">
    <div class="container">
      <p class="breadcrumb"><a href="/">Home</a> / <a href="/blog">Blog</a> / <span id="bc-category"></span></p>
      <div class="hero-pill" id="post-eyebrow-pill"><span class="hero-pill-dot"></span> <span id="post-eyebrow"></span></div>
      <h1 id="post-title" style="max-width:22ch;"></h1>
      <div class="post-meta-row">
        <span id="post-author"></span><span>·</span>
        <span id="post-date"></span><span>·</span>
        <span id="post-readtime"></span>
      </div>
    </div>
  </section>

  <!-- ══ HERO IMAGE ══════════════════════════════════════════ -->
  <div class="container" style="padding-bottom: clamp(2rem,4vw,3rem);">
    <img class="post-hero-img" id="post-hero-img" src="" alt="">
  </div>

  <!-- ══ ARTICLE BODY ════════════════════════════════════════ -->
  <section class="band" style="padding-top:0;">
    <div class="container">
      <div class="prose-wrap prose" id="post-body"></div>
    </div>
  </section>

  <!-- ══ FINAL CTA (reuses the site's existing final-cta band) ═ -->
  <section class="band final-cta">
    <div class="container">
      <span class="h-eyebrow">FIND OUT WHAT YOU'RE OWED</span>
      <h2>A 15-minute call is usually enough to know if it's worth pursuing.</h2>
      <p>No cost to check. No obligation to move forward.</p>
      <div class="btns">
        <a href="/schedule" class="btn btn-primary">Schedule a Discovery Call <span class="arr">→</span></a>
      </div>
    </div>
  </section>

  <!-- ══ FOOTER (shared, injected) ═══════════════════════════ -->
  <div id="bws-footer"></div>

</div>

<script>
(function () {

  /* ============================================================
     FILL IN YOUR POST HERE
     ============================================================
     This is the ONLY part of this file you ever need to touch.
     Fill in the info below, then write the article as a list of
     pieces further down, no HTML tags needed anywhere.
     ============================================================ */

  var POST = {
    category: "Merchant Services",       // must match one of the 5 site categories exactly
    title: "Why Your Processing Statement Is Confusing on Purpose",
    author: "By Nick Yocca",
    date: "August 14, 2026",
    readTime: "5 min read",
    heroImage: "https://d8j0ntlcm91z4.cloudfront.net/user_38oNqWKMwdpAnotKzjdcYuVu3hK/hf_20260831_174348_45b5bcac-3b7f-4a1d-ae5e-9899a76d187d.png",
    heroImageAlt: "Point of sale terminal at a retail counter",
    authorAvatar: "https://assets.cdn.filesafe.space/1ZMpwJ9nYwk9qTFScUtS/media/6a95c20c648f56e7e43550da.png",
    authorTitle: "Co-Founder & President, Big Wolf Solutions"
  };

  /* ------------------------------------------------------------
     Write the article here, piece by piece, top to bottom.
     Each piece is one of these types:

       { type: "paragraph", text: "..." }          → a normal paragraph
       { type: "heading", text: "..." }             → a section heading
       { type: "list", items: ["...", "...", "..."] } → a bulleted list
       { type: "callout", text: "..." }              → a highlighted tip box
       { type: "cta", label: "...", link: "..." }    → a blue button

     To add a new piece, copy one line and paste it where you want
     it to appear, then change the text inside the quote marks.
     ------------------------------------------------------------ */

  var CONTENT = [
    { type: "paragraph", text: "If you've ever tried to actually read your merchant processing statement line by line, you already know: it's not built to be understood. That's not an accident." },
    { type: "heading", text: "The three real cost buckets" },
    { type: "paragraph", text: "Every processing statement, underneath the confusing formatting, breaks down into three things:" },
    { type: "list", items: [
      "Interchange, the fee set by Visa/Mastercard/Amex, non-negotiable, the same for every processor",
      "Assessment fees, also fixed by the card networks, also non-negotiable",
      "Processor markup, the only piece that's actually negotiable, and the piece most often padded with vague line items like \"PCI non-compliance fee\" or \"batch fee\""
    ]},
    { type: "heading", text: "Where the padding hides" },
    { type: "paragraph", text: "Statements are often deliberately laid out so the markup is spread across several small line items instead of one clear number, making it hard to see, at a glance, what you're actually paying your processor versus what the card networks require." },
    { type: "callout", text: "The fastest way to know if you're overpaying: compare your effective rate (total fees divided by total volume processed) against your industry's typical range, not the \"rate\" printed on your statement." },
    { type: "paragraph", text: "We pull your last 3 months of statements and calculate your true effective rate, then show you exactly what's markup versus what's fixed. No commitment, no cost to check." },
    { type: "cta", label: "Get a Free Statement Analysis", link: "/schedule" }
  ];

  /* ============================================================
     Nothing below this line needs to be edited by Laila.
     ============================================================ */

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  var root = document.getElementById('bws-blog-post-root');
  root.querySelector('#bc-category').textContent = POST.category;
  root.querySelector('#post-eyebrow').textContent = POST.category;
  root.querySelector('#post-title').textContent = POST.title;
  root.querySelector('#post-author').textContent = POST.author;
  root.querySelector('#post-date').textContent = POST.date;
  root.querySelector('#post-readtime').textContent = POST.readTime;
  var heroImg = root.querySelector('#post-hero-img');
  heroImg.src = POST.heroImage;
  heroImg.alt = POST.heroImageAlt;

  var bodyEl = root.querySelector('#post-body');
  var html = CONTENT.map(function (block) {
    if (block.type === 'paragraph') return '<p>' + escapeHtml(block.text) + '</p>';
    if (block.type === 'heading') return '<h2>' + escapeHtml(block.text) + '</h2>';
    if (block.type === 'list') return '<ul>' + block.items.map(function (i) { return '<li>' + escapeHtml(i) + '</li>'; }).join('') + '</ul>';
    if (block.type === 'callout') return '<div class="callout">' + escapeHtml(block.text) + '</div>';
    if (block.type === 'cta') return '<a href="' + escapeHtml(block.link) + '" class="btn btn-primary inline-cta">' + escapeHtml(block.label) + ' <span class="arr">→</span></a>';
    return '';
  }).join('');

  html += '<div class="author-box">' +
    '<img class="author-avatar" src="' + escapeHtml(POST.authorAvatar) + '" alt="' + escapeHtml(POST.author) + '">' +
    '<p><strong>' + escapeHtml(POST.author.replace(/^By /, '')) + '</strong><br>' + escapeHtml(POST.authorTitle) + '</p>' +
    '</div>';

  bodyEl.innerHTML = html;

  /* ------------------------------------------------------------
     Structured data (SEO / AEO) — auto-built from POST/CONTENT above.
     ------------------------------------------------------------ */
  var firstParagraph = CONTENT.filter(function (b) { return b.type === 'paragraph'; })[0];
  // Schema description: the page's SEO description (set in GHL SEO settings), else the first paragraph.
  var seoDesc = document.querySelector('meta[name="description"]');
  var description = (seoDesc && seoDesc.content) ? seoDesc.content : (firstParagraph ? firstParagraph.text : POST.title);

  var parsedDate = new Date(POST.date);
  var dateISO = isNaN(parsedDate.getTime()) ? '' : parsedDate.toISOString().slice(0, 10);

  var schema = {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": POST.title,
    "description": description,
    "image": POST.heroImage,
    "author": { "@type": "Person", "name": POST.author.replace(/^By /, ''), "jobTitle": POST.authorTitle },
    "publisher": {
      "@type": "Organization", "name": "Big Wolf Solutions", "url": "https://www.bigwolfsolutions.net",
      "logo": { "@type": "ImageObject", "url": "https://assets.cdn.filesafe.space/1ZMpwJ9nYwk9qTFScUtS/media/69cec3ab75502063bb5a706a.png" }
    },
    "articleSection": POST.category,
    "mainEntityOfPage": { "@type": "WebPage", "@id": window.location.href }
  };
  if (dateISO) { schema.datePublished = dateISO; schema.dateModified = dateISO; }

  var schemaScript = document.createElement('script');
  schemaScript.type = 'application/ld+json';
  schemaScript.textContent = JSON.stringify(schema);
  document.head.appendChild(schemaScript);
})();
</script>

<!-- ══ Shared header/footer injection (identical to every other page) ══ -->
<script>
(function () {
  var BASE = 'https://cdn.jsdelivr.net/gh/murv-source/bws-site-assets@main/partials/';
  function runScripts(host){host.querySelectorAll('script').forEach(function(old){var s=document.createElement('script');for(var i=0;i<old.attributes.length;i++)s.setAttribute(old.attributes[i].name,old.attributes[i].value);s.textContent=old.textContent;old.parentNode.replaceChild(s,old);});}
  function inject(id,file){var host=document.getElementById(id);if(!host)return Promise.resolve();return fetch(BASE+file,{cache:'no-cache'}).then(function(r){return r.text();}).then(function(html){host.innerHTML=html;runScripts(host);});}
  inject('bws-header','header.html').then(function(){return inject('bws-footer','footer.html');});
})();
</script>
</body>
</html>
