   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://assets.cdn.filesafe.space/1ZMpwJ9nYwk9qTFScUtS/media/69cec39bfe4f1c0b67c6dd8c.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/murv-source/bws-site-assets@main/css/styles.css">
  <style>
    /* ── Blog-post-only additions — reuses site tokens, no new colors/fonts ── */
    body.tpl-blog-post .post-hero-img {
      display: block; width: 100%; max-width: var(--container); margin: 0 auto;
      aspect-ratio: 16/9; object-fit: cover; border-radius: var(--radius);
      border: 1px solid var(--line); box-shadow: 0 30px 60px -28px rgba(10,31,68,0.35);
    }
    body.tpl-blog-post .post-meta-row {
      display: flex; gap: 0.9rem; align-items: center; font-size: 0.88rem; color: var(--subdued);
      justify-content: center; margin-top: 0.4rem;
    }
    body.tpl-blog-post .breadcrumb { font-size: 0.85rem; color: var(--subdued); margin-bottom: 1rem; }
    body.tpl-blog-post .breadcrumb a { color: var(--subdued); text-decoration: none; }
    body.tpl-blog-post .breadcrumb a:hover { color: var(--ink); }
    body.tpl-blog-post .prose-wrap { max-width: 720px; margin: 0 auto; }
    body.tpl-blog-post .prose h2 { font-size: 1.5rem; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; margin: 2.4rem 0 0.9rem; }
    body.tpl-blog-post .prose ul { margin: 0 0 1.2rem; padding-left: 1.3rem; color: var(--body); }
    body.tpl-blog-post .prose li { margin-bottom: 0.5rem; line-height: 1.6; }
    body.tpl-blog-post .prose .inline-cta { margin: 0.5rem 0 1.6rem; }
    body.tpl-blog-post .author-box {
      display: flex; gap: 1rem; align-items: center; margin-top: 2.6rem; padding-top: 1.5rem; border-top: 1px solid var(--line);
    }
    body.tpl-blog-post .author-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: var(--surface); flex-shrink: 0; }
    body.tpl-blog-post .author-box p { margin: 0; color: var(--subdued); font-size: 0.92rem; }
    body.tpl-blog-post .author-box strong { color: var(--ink); font-size: 0.98rem; }
  </style>
</head>
<body class="tpl-blog-post">
<div id="bws-blog-post-root">

  <!-- ══ NAV (shared, injected) ══════════════════════════════ -->
  <div id="bws-header"></div>

  <!-- ══ POST HEADER ═════════════════════════════════════════ -->
  <section class="subhero">
    <div class="container">
      <p class="breadcrumb"><a href="/">Home</a> / <a href="/blog">Blog</a> / <span id="bc-category"></span></p>
      <div class="hero-pill" id="post-eyebrow-pill"><span class="hero-pill-dot"></span> <span id="post-eyebrow"></span></div>
      <h1 id="post-title" style="max-width:22ch;"></h1>
      <div class="post-meta-row">
        <span id="post-author"></span><span>·</span>
        <span id="post-date"></span><span>·</span>
        <span id="post-readtime"></span>
      </div>
    </div>
  </section>

  <!-- ══ HERO IMAGE ══════════════════════════════════════════ -->
  <div class="container" style="padding-bottom: clamp(2rem,4vw,3rem);">
    <img class="post-hero-img" id="post-hero-img" src="" alt="">
  </div>

  <!-- ══ ARTICLE BODY ════════════════════════════════════════ -->
  <section class="band" style="padding-top:0;">
    <div class="container">
      <div class="prose-wrap prose" id="post-body"></div>
    </div>
  </section>

  <!-- ══ FINAL CTA (reuses the site's existing final-cta band) ═ -->
  <section class="band final-cta">
    <div class="container">
      <span class="h-eyebrow">FIND OUT WHAT YOU'RE OWED</span>
      <h2>A 15-minute call is usually enough to know if it's worth pursuing.</h2>
      <p>No cost to check. No obligation to move forward.</p>
      <div class="btns">
        <a href="/schedule" class="btn btn-primary">Schedule a Discovery Call <span class="arr">→</span></a>
      </div>
    </div>
  </section>

  <!-- ══ FOOTER (shared, injected) ═══════════════════════════ -->
  <div id="bws-footer"></div>

</div>

<script>
(function () {

  /* ============================================================
     FILL IN YOUR POST HERE
     ============================================================
     This is the ONLY part of this file you ever need to touch.
     Fill in the info below, then write the article as a list of
     pieces further down, no HTML tags needed anywhere.
     ============================================================ */

  var POST = {
    category: "R&D Tax Credits",       // must match one of the 5 site categories exactly
    title: "7 R&D Tax Credit Misconceptions That Keep Businesses From Claiming",
    author: "By Nick Yocca",
    date: "September 17, 2026",
    readTime: "6 min read",
    heroImage: "https://assets.cdn.filesafe.space/1ZMpwJ9nYwk9qTFScUtS/media/6aac82f4de8ed1c29f442af2.png",
    heroImageAlt: "What business owners often get wrong about the federal R&D tax credit — Big Wolf Solutions",
    authorAvatar: "https://assets.cdn.filesafe.space/1ZMpwJ9nYwk9qTFScUtS/media/6a95c20c648f56e7e43550da.png",
    authorTitle: "Co-Founder & President, Big Wolf Solutions"
  };

  /* ------------------------------------------------------------
     Write the article here, piece by piece, top to bottom.
     Each piece is one of these types:

       { type: "paragraph", text: "..." }          → a normal paragraph
       { type: "heading", text: "..." }             → a section heading
       { type: "list", items: ["...", "...", "..."] } → a bulleted list
       { type: "callout", text: "..." }              → a highlighted tip box
       { type: "cta", label: "...", link: "..." }    → a blue button
       { type: "links", items: [{label:"...",url:"..."}, ...] } → a linked source list

     To add a new piece, copy one line and paste it where you want
     it to appear, then change the text inside the quote marks.
     ------------------------------------------------------------ */

  var CONTENT = [
    { type: "paragraph", text: "The federal R&D tax credit is designed to encourage businesses to invest in qualified research and experimentation. Yet many businesses never investigate whether their work may qualify because they assume the credit applies only to laboratories, breakthrough inventions, or large corporations. In reality, eligibility turns on the nature of the activities and expenses, not the company's industry label or whether a project ultimately succeeded." },
    { type: "paragraph", text: "Here are seven common misconceptions, and what business owners should understand before ruling themselves out." },
    { type: "heading", text: "1. \"Our project failed, so we don't qualify\"" },
    { type: "paragraph", text: "A successful outcome is not required. The research credit focuses on qualified research activities, including a process of experimentation undertaken to resolve technological uncertainty. A project that is abandoned, redesigned, or ultimately underperforms can still contain qualifying work if the applicable requirements are met. What matters is the activity performed, not simply whether the final result worked." },
    { type: "heading", text: "2. \"We're not profitable, so there's no benefit for us\"" },
    { type: "paragraph", text: "For certain qualified small businesses, the R&D credit may be elected against payroll tax liability rather than used only against income tax. Under IRC Section 41(h), a qualified small business generally must have less than $5 million in gross receipts for the tax year and no gross receipts for any tax year before the five-tax-year period ending with that year. For tax years beginning after 2022, the maximum annual payroll tax credit election is $500,000. The credit is first applied against the employer share of Social Security tax, with eligible remaining credit applied against the employer share of Medicare tax under the applicable rules. The election is made on Form 6765 and claimed through Form 8974 with the employment tax return." },
    { type: "heading", text: "3. \"This is only for scientists in a lab\"" },
    { type: "paragraph", text: "Qualified research is not limited to laboratory work or employees with scientific titles. Depending on the facts, qualifying activities can arise while improving manufacturing methods, developing or testing tooling, refining formulas, integrating equipment, designing or improving software, or solving engineering and production problems. The work must still satisfy the federal requirements for qualified research, including technological uncertainty and a qualifying process of experimentation." },
    { type: "heading", text: "4. \"We're not inventing anything new, so we don't qualify\"" },
    { type: "paragraph", text: "The credit is not limited to products or processes that are new to the world. Work aimed at developing or improving a business component's function, performance, reliability, or quality may qualify. That can include improving an existing product, process, software application, technique, formula, or invention, provided the activities meet the applicable tests. Routine changes, cosmetic changes, duplication, and certain other excluded activities do not qualify merely because a business made an improvement." },
    { type: "heading", text: "5. \"This is only for big companies with big budgets\"" },
    { type: "paragraph", text: "Company size does not determine whether research activities qualify. Small and mid-sized businesses can perform the same types of technical problem-solving and experimentation as larger organizations. Eligibility depends on the specific activities, expenses, and documentation. In fact, the payroll tax election was created specifically to make the credit usable by certain younger qualified small businesses that may not yet have significant income tax liability." },
    { type: "heading", text: "6. \"The paperwork isn't worth the payout\"" },
    { type: "paragraph", text: "The credit does require support. Businesses should be able to identify the relevant business components and qualifying activities, connect qualified research expenses to those activities, and maintain documentation sufficient to substantiate the claim. Form 6765 is used to calculate and claim the federal research credit, and Form 8974 is used when an eligible business applies an elected portion against payroll taxes. A properly structured R&D tax credit study can organize the technical and financial support needed for the claim and reduce the burden on the business owner and tax team." },
    { type: "heading", text: "7. \"We missed it in past years, so that money is gone\"" },
    { type: "paragraph", text: "Not necessarily. A business may be able to claim the credit on an amended return for an open tax year, subject to the applicable refund statute and the requirements for a valid research credit claim. In general, a federal refund claim must be filed by the later of three years from the date the original return was filed or two years from the date the tax was paid, although special rules and exceptions can apply. Research credit refund claims also have specific substantiation requirements, so prior-year opportunities should be reviewed carefully before filing." },
    { type: "heading", text: "The Takeaway" },
    { type: "paragraph", text: "The R&D tax credit is technical, but the types of activities that may qualify are often broader than business owners expect. A short eligibility review can help determine whether it is worth conducting a more detailed analysis before a business dismisses the opportunity." },
    { type: "callout", text: "Curious whether your business may qualify? Schedule a complimentary R&D tax credit eligibility review and we'll walk through your situation, no obligation." },
    { type: "cta", label: "Schedule a Free Eligibility Review", link: "/schedule" },
    { type: "heading", text: "Primary Sources" },
    { type: "links", items: [
      { label: "IRS, Instructions for Form 6765 (Credit for Increasing Research Activities)", url: "https://www.irs.gov/instructions/i6765" },
      { label: "IRS, Research credit against payroll tax for small businesses", url: "https://www.irs.gov/businesses/small-businesses-self-employed/research-credit-against-payroll-tax-for-small-businesses" },
      { label: "IRS, Qualified small business payroll tax credit for increasing research activities", url: "https://www.irs.gov/businesses/small-businesses-self-employed/qualified-small-business-payroll-tax-credit-for-increasing-research-activities" },
      { label: "IRS, Time you can claim a credit or refund", url: "https://www.irs.gov/filing/time-you-can-claim-a-credit-or-refund" },
      { label: "IRS, Instructions for Form 8974", url: "https://www.irs.gov/instructions/i8974" }
    ]},
    { type: "paragraph", text: "Important: This article is for general informational purposes only and is not tax, legal, or accounting advice. Eligibility for the R&D tax credit depends on the facts and circumstances of each taxpayer. Businesses should consult their tax professional regarding their specific situation." }
  ];

  /* ============================================================
     Nothing below this line needs to be edited by Laila.
     ============================================================ */

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  var root = document.getElementById('bws-blog-post-root');
  root.querySelector('#bc-category').textContent = POST.category;
  root.querySelector('#post-eyebrow').textContent = POST.category;
  root.querySelector('#post-title').textContent = POST.title;
  root.querySelector('#post-author').textContent = POST.author;
  root.querySelector('#post-date').textContent = POST.date;
  root.querySelector('#post-readtime').textContent = POST.readTime;
  var heroImg = root.querySelector('#post-hero-img');
  heroImg.src = POST.heroImage;
  heroImg.alt = POST.heroImageAlt;

  var bodyEl = root.querySelector('#post-body');
  var html = CONTENT.map(function (block) {
    if (block.type === 'paragraph') return '<p>' + escapeHtml(block.text) + '</p>';
    if (block.type === 'heading') return '<h2>' + escapeHtml(block.text) + '</h2>';
    if (block.type === 'list') return '<ul>' + block.items.map(function (i) { return '<li>' + escapeHtml(i) + '</li>'; }).join('') + '</ul>';
    if (block.type === 'callout') return '<div class="callout">' + escapeHtml(block.text) + '</div>';
    if (block.type === 'cta') return '<a href="' + escapeHtml(block.link) + '" class="btn btn-primary inline-cta">' + escapeHtml(block.label) + ' <span class="arr">→</span></a>';
    if (block.type === 'links') return '<ul>' + block.items.map(function (i) { return '<li><a href="' + escapeHtml(i.url) + '" target="_blank" rel="noopener">' + escapeHtml(i.label) + '</a></li>'; }).join('') + '</ul>';
    return '';
  }).join('');

  html += '<div class="author-box">' +
    '<img class="author-avatar" src="' + escapeHtml(POST.authorAvatar) + '" alt="' + escapeHtml(POST.author) + '">' +
    '<p><strong>' + escapeHtml(POST.author.replace(/^By /, '')) + '</strong><br>' + escapeHtml(POST.authorTitle) + '</p>' +
    '</div>';

  bodyEl.innerHTML = html;

  /* ------------------------------------------------------------
     Structured data (SEO / AEO) — auto-built from POST/CONTENT above.
     ------------------------------------------------------------ */
  var firstParagraph = CONTENT.filter(function (b) { return b.type === 'paragraph'; })[0];
  // Schema description: the page's SEO description (set in GHL SEO settings), else the first paragraph.
  var seoDesc = document.querySelector('meta[name="description"]');
  var description = (seoDesc && seoDesc.content) ? seoDesc.content : (firstParagraph ? firstParagraph.text : POST.title);

  var parsedDate = new Date(POST.date);
  var dateISO = isNaN(parsedDate.getTime()) ? '' : parsedDate.toISOString().slice(0, 10);

  var schema = {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": POST.title,
    "description": description,
    "image": POST.heroImage,
    "author": { "@type": "Person", "name": POST.author.replace(/^By /, ''), "jobTitle": POST.authorTitle },
    "publisher": {
      "@type": "Organization", "name": "Big Wolf Solutions", "url": "https://www.bigwolfsolutions.net",
      "logo": { "@type": "ImageObject", "url": "https://assets.cdn.filesafe.space/1ZMpwJ9nYwk9qTFScUtS/media/69cec3ab75502063bb5a706a.png" }
    },
    "articleSection": POST.category,
    "mainEntityOfPage": { "@type": "WebPage", "@id": window.location.href }
  };
  if (dateISO) { schema.datePublished = dateISO; schema.dateModified = dateISO; }

  var schemaScript = document.createElement('script');
  schemaScript.type = 'application/ld+json';
  schemaScript.textContent = JSON.stringify(schema);
  document.head.appendChild(schemaScript);
})();
</script>

<!-- ══ Shared header/footer injection (identical to every other page) ══ -->
<script>
(function () {
  var BASE = 'https://cdn.jsdelivr.net/gh/murv-source/bws-site-assets@main/partials/';
  function runScripts(host){host.querySelectorAll('script').forEach(function(old){var s=document.createElement('script');for(var i=0;i<old.attributes.length;i++)s.setAttribute(old.attributes[i].name,old.attributes[i].value);s.textContent=old.textContent;old.parentNode.replaceChild(s,old);});}
  function inject(id,file){var host=document.getElementById(id);if(!host)return Promise.resolve();return fetch(BASE+file,{cache:'no-cache'}).then(function(r){return r.text();}).then(function(html){host.innerHTML=html;runScripts(host);});}
  inject('bws-header','header.html').then(function(){return inject('bws-footer','footer.html');});
})();
</script>
</body>
</html>
